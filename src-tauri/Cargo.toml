[package]
name = "dkb-monitor"
version = "1.3.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dkb_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "net"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
window-vibrancy = "0.6"
sysinfo = "0.32"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"

# smappservice-rs wraps macOS's ServiceManagement framework (objc2 bindings) and
# does not compile on other platforms at all, so it must stay target-scoped
# rather than a regular dependency — otherwise `cargo check`/build fails outright
# on Windows before any of our own #[cfg(...)] code is even reached.
[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"
smc = "0.2.4"

# Windows autostart uses the registry Run key directly instead (see autostart.rs).
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

# tauri-plugin-notification's own `.show()` is fire-and-forget (discards the
# click callback), so notification.rs calls notify-rust directly to get a
# handle it can wait on. Version pinned to what tauri-plugin-notification
# itself already pulls in (see its Cargo.toml) so we don't introduce a second,
# divergent copy in Cargo.lock. Scoped to our two shipped platforms only —
# unlike the plugin's own dependency line, we don't need the Linux/BSD (dbus)
# backends this app never builds for.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
notify-rust = "4.11"

