name: Native (Swift) Release

# Fires on a `v*` tag push (Phase 10 of docs/swift-native-port-plan.md).
# Builds + Developer ID signs + notarizes + DMGs + Sparkle-signs the native
# app, then publishes a GitHub Release with the DMG and a generated
# appcast.xml attached.
#
# ONE-TIME SETUP REQUIRED before this workflow can run past the build step —
# none of these can be filled in by an agent, they're your credentials:
#   - SUPublicEDKey in project.yml is still the placeholder string;
#     generate a real EdDSA keypair (Sparkle's `generate_keys` tool — grab
#     the prebuilt binary from a Sparkle release tarball at
#     https://github.com/sparkle-project/Sparkle/releases, matching the
#     version pinned in project.yml) and paste the public half in.
#   - Repo secrets to add (Settings > Secrets and variables > Actions):
#       APPLE_DEVELOPER_ID_CERT_P12_BASE64  — `base64 -i cert.p12 | pbcopy`
#       APPLE_DEVELOPER_ID_CERT_PASSWORD    — the .p12's export password
#       APPLE_TEAM_ID                       — your Developer Team ID
#       APPLE_NOTARIZE_KEY_ID               — App Store Connect API key ID
#       APPLE_NOTARIZE_ISSUER_ID            — API key's issuer ID
#       APPLE_NOTARIZE_KEY_P8_BASE64        — `base64 -i AuthKey_XXX.p8 | pbcopy`
#       CI_KEYCHAIN_PASSWORD                — any random string, scoped to
#                                              the temporary CI keychain only
#       SPARKLE_ED_PRIVATE_KEY              — printed by `generate_keys`
#                                              alongside the public key above
#
# Confirmed 2026-08-29: admin.dangkhoabach.vn has no upload API, only the
# same manual web UI the old (now-removed) Tauri release process used
# — so GitHub Releases is the real, permanent appcast host here, not a
# placeholder. `SUFeedURL` in project.yml points at
# github.com/.../releases/latest/download/appcast.xml, which this workflow
# keeps current on every `v*` tag.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Test DKBMonitorCore (headless package)
        working-directory: DKBMonitorCore
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DKBMonitorNative.xcodeproj -scheme DKBMonitorApp \
            -archivePath "$RUNNER_TEMP/DKBMonitorApp.xcarchive" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export archive
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DKBMonitorApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Notarize and staple
        env:
          APPLE_NOTARIZE_KEY_ID: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          APPLE_NOTARIZE_ISSUER_ID: ${{ secrets.APPLE_NOTARIZE_ISSUER_ID }}
          APPLE_NOTARIZE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZE_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_NOTARIZE_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          APP_PATH="$RUNNER_TEMP/export/DKB Monitor.app"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/DKB Monitor.zip"
          xcrun notarytool submit "$RUNNER_TEMP/DKB Monitor.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARIZE_KEY_ID" \
            --issuer "$APPLE_NOTARIZE_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          mkdir -p "$DMG_ROOT"
          cp -R "$RUNNER_TEMP/export/DKB Monitor.app" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "DKB Monitor" -srcfolder "$DMG_ROOT" -ov -format UDZO \
            "$RUNNER_TEMP/DKB-Monitor-$VERSION.dmg"

      - name: Sign update and generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # `generate_appcast` ships in Sparkle's release tarball, pinned to
          # the same version as project.yml's SPM dependency — bump
          # both together if you ever change one.
          SPARKLE_VERSION="2.6.4"
          curl -fsSL -o "$RUNNER_TEMP/sparkle-tools.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xf "$RUNNER_TEMP/sparkle-tools.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"

          APPCAST_DIR="$RUNNER_TEMP/appcast-input"
          mkdir -p "$APPCAST_DIR"
          cp "$RUNNER_TEMP/DKB-Monitor-$VERSION.dmg" "$APPCAST_DIR/"

          "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
            --ed-key-file <(echo "$SPARKLE_ED_PRIVATE_KEY") \
            "$APPCAST_DIR"

          cp "$APPCAST_DIR/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/DKB-Monitor-${{ env.VERSION }}.dmg
            ${{ runner.temp }}/appcast.xml
          generate_release_notes: true
