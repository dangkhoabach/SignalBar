name: Native (Swift) CI

on:
  push:
    branches: [main]
    paths:
      - "DKBMonitorApp/**"
      - "DKBMonitorCore/**"
      - "project.yml"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "DKBMonitorApp/**"
      - "DKBMonitorCore/**"
      - "project.yml"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Test DKBMonitorCore (headless package)
        working-directory: DKBMonitorCore
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DKBMonitorApp
        run: |
          xcodebuild -project DKBMonitorNative.xcodeproj -scheme DKBMonitorApp -configuration Debug build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
