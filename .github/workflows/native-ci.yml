name: Native (Swift) CI

# Build + test only. Releases are built, signed and published locally
# (scripts/release.sh), so nothing here needs a secret.

on:
  push:
    branches: [main]
    paths:
      - "SignalBarApp/**"
      - "SignalBarAppTests/**"
      - "SignalBarCore/**"
      - "SignalBar.xcodeproj/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "SignalBarApp/**"
      - "SignalBarAppTests/**"
      - "SignalBarCore/**"
      - "SignalBar.xcodeproj/**"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Test SignalBarCore (headless package)
        working-directory: SignalBarCore
        run: swift test

      - name: Build SignalBarApp
        run: |
          xcodebuild -project SignalBar.xcodeproj -scheme SignalBarApp -configuration Debug build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
