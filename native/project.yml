name: DKBMonitorNative
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: NO
packages:
  DKBMonitorCore:
    path: DKBMonitorCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  DKBMonitorApp:
    type: application
    platform: macOS
    sources:
      - DKBMonitorApp
    dependencies:
      - package: DKBMonitorCore
      - package: Sparkle
    info:
      path: DKBMonitorApp/Info.plist
      properties:
        LSUIElement: false
        # Sparkle (Phase 10). SUPublicEDKey is a placeholder until the real
        # keypair is generated — see docs/swift-native-port-plan.md's Phase
        # 10 notes for the exact one-time setup steps (private half goes
        # into the SPARKLE_ED_PRIVATE_KEY GitHub Actions secret, never here).
        # SUFeedURL points at GitHub Releases (not admin.dangkhoabach.vn):
        # that panel has no upload API, only a manual web UI (confirmed
        # 2026-08-29 — see release/README.md for the old Tauri app's same
        # manual-only process) — GitHub Releases is already fully automated
        # end-to-end by native-release.yml, so it's the real host, not a
        # placeholder. The "latest" alias always resolves to the most
        # recent non-prerelease tag.
        SUFeedURL: https://github.com/dangkhoabach/DKB-Monitor/releases/latest/download/appcast.xml
        SUPublicEDKey: REPLACE_WITH_GENERATED_ED25519_PUBLIC_KEY
        # Automatic checks stay off until the real keypair above is in place
        # and at least one release exists — otherwise Sparkle fails every
        # check (no valid feed to reach) and surfaces an "Unable to Check
        # For Updates" alert on every single launch. Flip this to true once
        # Phase 10's real setup is done; "Check for Updates…" in the menu
        # bar still works manually in the meantime.
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DKBMonitorApp/DKBMonitorApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-monitor
      PRODUCT_NAME: "DKB Monitor"

  # Phase 0 scaffold, kept for reference — see PoC/ and README.md. Distinct
  # bundle id (.poc suffix) so it never collides with DKBMonitorApp's real
  # identity (Login Items/notifications) above.
  DKBMonitorPoC:
    type: application
    platform: macOS
    sources:
      - PoC
    info:
      path: PoC/Info.plist
      properties:
        LSUIElement: false
        NSHumanReadableCopyright: "Proof-of-concept scaffold, not for distribution."
    entitlements:
      path: PoC/PoC.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkbmonitor2.poc
