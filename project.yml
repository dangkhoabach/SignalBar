name: DKBMonitorNative
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: NO
packages:
  DKBMonitorCore:
    path: DKBMonitorCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  DKBMonitorApp:
    type: application
    platform: macOS
    sources:
      - DKBMonitorApp
    dependencies:
      - package: DKBMonitorCore
      - package: Sparkle
    info:
      path: DKBMonitorApp/Info.plist
      properties:
        # Source of truth for the release version - Info.plist is fully
        # regenerated from this file on every `xcodegen generate` (not
        # merged), so editing Info.plist directly gets silently discarded.
        # scripts/release.sh edits these two lines, not the plist.
        CFBundleShortVersionString: "2.0.2"
        CFBundleVersion: "2.0.2"
        LSUIElement: false
        # Sparkle (Phase 10). Real EdDSA keypair generated 2026-08-30 via
        # Sparkle 2.6.4's `generate_keys` tool. SUPublicEDKey below is the
        # public half. The private half stays in this machine's login
        # Keychain only (item "Private key for signing Sparkle updates") —
        # releases are signed manually here via `sign_update`/
        # `generate_appcast` (same manual-release model as the old Tauri
        # app's release/README.md), not exported to a GitHub Actions secret.
        # `native-release.yml`'s CI-based Sparkle-signing step still expects
        # a `SPARKLE_ED_PRIVATE_KEY` secret and isn't wired up for this
        # manual flow yet — see docs/swift-native-port-plan.md's Phase 10
        # notes before relying on that workflow.
        # Same domain the old Tauri app's updater used (updates.dangkhoabach.vn),
        # just a different file — not GitHub Releases, this project doesn't
        # publish there. MyWebsiteAPI's AppReleaseService now supports
        # generating this appcast.xml from a manual admin.dangkhoabach.vn
        # upload (installer + Sparkle sig) — see docs/swift-native-port-plan.md
        # Phase 10 notes. It only starts resolving once that first upload
        # has actually been done for the dkb-monitor slug.
        SUFeedURL: https://updates.dangkhoabach.vn/dkb-monitor/appcast.xml
        SUPublicEDKey: yAEEvjvy+kV1gxLltskQ9iBfixVqZguKZrjXTv/lj9g=
        # Automatic checks stay off until at least one real release exists
        # at SUFeedURL (the key alone doesn't help if there's no appcast to
        # reach yet) — otherwise Sparkle fails every check and surfaces an
        # "Unable to Check For Updates" alert on every single launch. Flip
        # this to true once the first tagged release has gone through
        # native-release.yml; "Check for Updates…" in the menu bar will
        # still fail manually until then too, which is expected.
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DKBMonitorApp/DKBMonitorApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-monitor
      PRODUCT_NAME: "DKB Monitor"
      # App icon reused from the old Tauri app's src-tauri/icons/icon.icns
      # (1024x1024 source, re-sliced into DKBMonitorApp/Resources/
      # Assets.xcassets/AppIcon.appiconset) so Dock/Finder show the same
      # dark-rounded-square pulse glyph as the previous app.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
