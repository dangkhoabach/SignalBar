name: DKBMonitorNative
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  # The compiler writes every SwiftUI string literal it sees, with the exact
  # runtime key it will look up (an Int interpolation is `%lld`, a String is
  # `%@`), into .stringsdata under DerivedData. The catalog was hand-written
  # before this was on, and every one of its 42 interpolated keys used `%@`,
  # so its translations for any number never matched at runtime.
  SWIFT_EMIT_LOC_STRINGS: YES
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: NO
packages:
  DKBMonitorCore:
    path: DKBMonitorCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  DKBMonitorApp:
    type: application
    platform: macOS
    sources:
      - DKBMonitorApp
    dependencies:
      - package: DKBMonitorCore
      - package: Sparkle
    info:
      path: DKBMonitorApp/Info.plist
      properties:
        # Source of truth for the release version - Info.plist is fully
        # regenerated from this file on every `xcodegen generate` (not
        # merged), so editing Info.plist directly gets silently discarded.
        # scripts/release.sh edits these two lines, not the plist.
        CFBundleShortVersionString: "2.0.5"
        CFBundleVersion: "2.0.5"
        LSUIElement: false
        # Sparkle (Phase 10). Real EdDSA keypair generated 2026-08-30 via
        # Sparkle 2.6.4's `generate_keys` tool. SUPublicEDKey below is the
        # public half. The private half stays in this machine's login
        # Keychain only (item "Private key for signing Sparkle updates") —
        # releases are signed manually here via `sign_update`/
        # `generate_appcast` (same manual-release model as the old Tauri
        # app's release/README.md), not exported to a GitHub Actions secret.
        # There is no CI release path any more: `.github/workflows/` no
        # longer exists, so the `SPARKLE_ED_PRIVATE_KEY` secret this comment
        # used to warn about has nothing left to read it. scripts/release.sh
        # is the whole release process.
        # Same domain the old Tauri app's updater used (updates.dangkhoabach.vn),
        # just a different file — not GitHub Releases, this project doesn't
        # publish there. MyWebsiteAPI's AppReleaseService now supports
        # generating this appcast.xml from a manual admin.dangkhoabach.vn
        # upload (installer + Sparkle sig) — see docs/swift-native-port-plan.md
        # Phase 10 notes. It only starts resolving once that first upload
        # has actually been done for the dkb-monitor slug.
        SUFeedURL: https://updates.dangkhoabach.vn/dkb-monitor/appcast.xml
        SUPublicEDKey: yAEEvjvy+kV1gxLltskQ9iBfixVqZguKZrjXTv/lj9g=
        # Deliberately NOT setting SUEnableAutomaticChecks. Hardcoding it to
        # true suppressed Sparkle's own first-launch permission prompt, so
        # the app contacted the update server every day without ever asking
        # — a daily phone-home nobody agreed to. Leaving the key out lets
        # that prompt run, and Settings › Updates can flip the answer later.
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DKBMonitorApp/DKBMonitorApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-monitor
      PRODUCT_NAME: "DKB Monitor"
      # App icon reused from the old Tauri app's src-tauri/icons/icon.icns
      # (1024x1024 source, re-sliced into DKBMonitorApp/Resources/
      # Assets.xcassets/AppIcon.appiconset) so Dock/Finder show the same
      # dark-rounded-square pulse glyph as the previous app.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DKBMonitorAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DKBMonitorAppTests
    dependencies:
      - target: DKBMonitorApp
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DKB Monitor.app/Contents/MacOS/DKB Monitor"
      BUNDLE_LOADER: "$(TEST_HOST)"
